# Hourly: fetch all feeds, append new headlines to the branch "daten"
# (titel/JJJJ/MM/TT.jsonl), assign topics with Claude Code (themen.json) and write
# daten.json there. The main branch gets no data commits.
#
# Repository secret: CLAUDE_CODE_OAUTH_TOKEN (Claude subscription, `claude setup-token`).
# Without it, or if the model fails, headlines are still stored and get their topic in a
# later run.
name: Abruf
run-name: "Abruf"

on:
  schedule:
    - cron: "17 * * * *"  # not on the full hour, GitHub delays scheduled runs there
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Branch daten nach daten/ holen (beim ersten Lauf neu anlegen)
        run: |
          if git ls-remote --exit-code --heads origin daten >/dev/null; then
            git fetch --depth 1 origin daten
            git worktree add daten FETCH_HEAD
            git -C daten switch -c daten
          else
            git worktree add --orphan -b daten daten
          fi

      - uses: astral-sh/setup-uv@v10.4.0  # no major-version tag v10

      - name: Python-Umgebung
        run: uv sync --frozen --no-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Claude Code installieren
        run: npm install -g @anthropic-ai/claude-code

      # A failing step must not lose the fetched headlines: the commit step runs anyway.
      - name: Feeds abrufen und Themen zuordnen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MM_LABELER: claude_cli
          MM_MODEL: sonnet
        run: uv run --no-dev scripts/run_hourly.py --data-dir daten

      - name: Neue Schlagzeilen und Themen committen
        if: ${{ !cancelled() }}
        working-directory: daten
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Keine neuen Schlagzeilen."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Abruf $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:daten

      # Upload of daten.json to deutschlandmonitor.info/medienmonitor/ (Host Europe, SFTP).
      # Skipped while the secrets are missing. The SFTP user can write to all sites of the
      # package, so the step checks two marker files (put there once by hand) and writes
      # nothing but medienmonitor/daten.json: no mirror, no delete.
      #   $HE_TARGET_DIR/upload-ziel.txt               contains "deutschlandmonitor.info"
      #   $HE_TARGET_DIR/medienmonitor/upload-ziel.txt contains "medienmonitor"
      # Secrets HE_SSH_USER, HE_SSH_PASSWORD, HE_SSH_KNOWN_HOSTS and variable HE_TARGET_DIR
      # as in the repository deutschlandmonitor (.github/workflows/site.yml).
      - name: daten.json hochladen
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          LFTP_PASSWORD: ${{ secrets.HE_SSH_PASSWORD }}
          HE_SSH_USER: ${{ secrets.HE_SSH_USER }}
          KNOWN_HOSTS: ${{ secrets.HE_SSH_KNOWN_HOSTS }}
          TARGET_DIR: ${{ vars.HE_TARGET_DIR }}
        run: |
          if [ -z "$HE_SSH_USER" ] || [ -z "$LFTP_PASSWORD" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$TARGET_DIR" ]; then
            echo "SFTP-Zugang nicht eingerichtet, Upload übersprungen."
            exit 0
          fi
          test -s daten/daten.json || { echo "daten.json fehlt"; exit 1; }
          if [[ ! "$TARGET_DIR" =~ ^/?([A-Za-z0-9._-]+/)*deutschlandmonitor/?$ || "$TARGET_DIR" == *..* ]]; then
            echo "HE_TARGET_DIR muss auf /deutschlandmonitor enden"; exit 1
          fi
          TARGET_DIR="${TARGET_DIR%/}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          which lftp >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q lftp; }
          read_marker() {
            lftp -u "$HE_SSH_USER" --env-password sftp://ssh.server-he.de -e "
              set sftp:auto-confirm false; set net:max-retries 2;
              cat $1; bye" 2>/dev/null | tr -d '\r\n'
          }
          if [[ "$(read_marker "$TARGET_DIR/upload-ziel.txt")" != "deutschlandmonitor.info" ]]; then
            echo "Marke $TARGET_DIR/upload-ziel.txt fehlt oder stimmt nicht. Nichts geändert."; exit 1
          fi
          if [[ "$(read_marker "$TARGET_DIR/medienmonitor/upload-ziel.txt")" != "medienmonitor" ]]; then
            echo "Marke $TARGET_DIR/medienmonitor/upload-ziel.txt fehlt oder stimmt nicht. Nichts geändert."; exit 1
          fi
          # Upload under a temporary name, then swap (SFTP rename does not overwrite): a
          # reader never gets half a file, at most a missing one for a few milliseconds.
          lftp -u "$HE_SSH_USER" --env-password sftp://ssh.server-he.de -e "
            set sftp:auto-confirm false;
            set net:max-retries 2;
            set cmd:fail-exit yes;
            cd $TARGET_DIR/medienmonitor;
            put daten/daten.json -o daten.json.neu;
            rm -f daten.json;
            mv daten.json.neu daten.json;
            bye"
          echo "daten.json hochgeladen."
