# Hourly: fetch all feeds, append new headlines to the branch "daten"
# (titel/JJJJ/MM/TT.jsonl), assign topics with Claude Code (themen.json) and write
# daten.json there. The main branch gets no data commits. Every 3 hours also YouTube
# (scripts/run_youtube.py, secret YOUTUBE_API_KEY).
#
# Repository secret: CLAUDE_CODE_OAUTH_TOKEN (Claude subscription, `claude setup-token`).
# Without it, or if the model fails, headlines are still stored and get their topic in a
# later run.
name: Abruf
run-name: "Abruf"

on:
  schedule:
    - cron: "17 * * * *"  # not on the full hour, GitHub delays scheduled runs there
  workflow_dispatch:
    inputs:
      neu_zuordnen:
        description: "Thema auflösen und neu zuordnen (Kennung wie T114, sonst leer)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Branch daten nach daten/ holen (beim ersten Lauf neu anlegen)
        run: |
          if git ls-remote --exit-code --heads origin daten >/dev/null; then
            git fetch --depth 1 origin daten
            git worktree add daten FETCH_HEAD
            git -C daten switch -c daten
          else
            git worktree add --orphan -b daten daten
          fi

      - uses: astral-sh/setup-uv@v10.4.0  # no major-version tag v10

      - name: Python-Umgebung
        run: uv sync --frozen --no-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Claude Code installieren
        run: npm install -g @anthropic-ai/claude-code

      # A failing step must not lose the fetched headlines: the commit step runs anyway.
      - name: Feeds abrufen und Themen zuordnen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MM_LABELER: claude_cli
          MM_MODEL: sonnet
          DISSOLVE: ${{ inputs.neu_zuordnen }}
        run: |
          if [[ -n "$DISSOLVE" && ! "$DISSOLVE" =~ ^T[0-9]+$ ]]; then
            echo "neu_zuordnen muss eine Kennung wie T114 sein"; exit 1
          fi
          uv run --no-dev scripts/run_hourly.py --data-dir daten ${DISSOLVE:+--neu-zuordnen "$DISSOLVE"}

      # YouTube every 3 hours (and on manual start): youtube.html and kanaele.html for the
      # pages "Video-Medien" and "YouTube-Kanäle". Only the current state, no history
      # (YouTube API terms); nothing goes to the branch daten. About 200 of the 10,000
      # free quota units per run. Secret YOUTUBE_API_KEY; skipped while it is missing.
      - name: YouTube abrufen
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY fehlt, YouTube übersprungen."; exit 0
          fi
          if [ "$EVENT" != "workflow_dispatch" ] && (( 10#$(date -u +%H) % 3 != 0 )); then
            echo "YouTube nur alle 3 Stunden."; exit 0
          fi
          uv run --no-dev scripts/run_youtube.py --out youtube-ausgabe

      - name: Neue Schlagzeilen und Themen committen
        if: ${{ !cancelled() }}
        working-directory: daten
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Keine neuen Schlagzeilen."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Abruf $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:daten

      # Upload of grafik.html (embedded by the page "Text-Medien"), daten.json and, every 3
      # hours, youtube.html and kanaele.html to
      # deutschlandmonitor.info/medienmonitor/ (Host Europe, SFTP).
      # Skipped while the secrets are missing. The SFTP user can write to all sites of the
      # package, so the step checks the marker file of the site and then writes nothing
      # but the folder medienmonitor/ and the files in it: no mirror, no delete.
      #   $HE_TARGET_DIR/upload-ziel.txt  contains "deutschlandmonitor.info"
      # The website workflow of deutschlandmonitor excludes medienmonitor/ from its
      # mirror --delete.
      # Secrets HE_SSH_USER, HE_SSH_PASSWORD, HE_SSH_KNOWN_HOSTS and variable HE_TARGET_DIR
      # as in the repository deutschlandmonitor (.github/workflows/site.yml).
      - name: Grafik hochladen
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          LFTP_PASSWORD: ${{ secrets.HE_SSH_PASSWORD }}
          HE_SSH_USER: ${{ secrets.HE_SSH_USER }}
          KNOWN_HOSTS: ${{ secrets.HE_SSH_KNOWN_HOSTS }}
          TARGET_DIR: ${{ vars.HE_TARGET_DIR }}
        run: |
          if [ -z "$HE_SSH_USER" ] || [ -z "$LFTP_PASSWORD" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$TARGET_DIR" ]; then
            echo "SFTP-Zugang nicht eingerichtet, Upload übersprungen."
            exit 0
          fi
          test -s daten/daten.json || { echo "daten.json fehlt"; exit 1; }
          test -s daten/grafik.html || { echo "grafik.html fehlt"; exit 1; }
          if [[ ! "$TARGET_DIR" =~ ^/?([A-Za-z0-9._-]+/)*deutschlandmonitor/?$ || "$TARGET_DIR" == *..* ]]; then
            echo "HE_TARGET_DIR muss auf /deutschlandmonitor enden"; exit 1
          fi
          TARGET_DIR="${TARGET_DIR%/}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          which lftp >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q lftp; }
          # lftp's error text (login, host key, missing file) goes to the log; it never
          # contains the password.
          read_marker() {
            lftp -u "$HE_SSH_USER" --env-password sftp://ssh.server-he.de -e "
              set sftp:auto-confirm false; set net:max-retries 2;
              cat $1; bye" 2>lftp-fehler.txt | tr -d '\r\n'
            if [ -s lftp-fehler.txt ]; then echo "lftp: $(head -c 300 lftp-fehler.txt)" >&2; fi
          }
          if [[ "$(read_marker "$TARGET_DIR/upload-ziel.txt")" != "deutschlandmonitor.info" ]]; then
            echo "Marke $TARGET_DIR/upload-ziel.txt fehlt oder stimmt nicht. Nichts geändert."; exit 1
          fi
          # Upload under a temporary name, then swap (SFTP rename does not overwrite): a
          # reader never gets half a file, at most a missing one for a few milliseconds.
          lftp -u "$HE_SSH_USER" --env-password sftp://ssh.server-he.de -e "
            set sftp:auto-confirm false;
            set net:max-retries 2;
            set cmd:fail-exit yes;
            cd $TARGET_DIR;
            mkdir -f -p medienmonitor;
            cd medienmonitor;
            put daten/daten.json -o daten.json.neu;
            rm -f daten.json;
            mv daten.json.neu daten.json;
            put daten/grafik.html -o grafik.html.neu;
            rm -f grafik.html;
            mv grafik.html.neu grafik.html;
            bye"
          echo "daten.json und grafik.html hochgeladen."
          # youtube.html and kanaele.html only in runs that fetched YouTube
          if [ -s youtube-ausgabe/youtube.html ] && [ -s youtube-ausgabe/kanaele.html ]; then
            lftp -u "$HE_SSH_USER" --env-password sftp://ssh.server-he.de -e "
              set sftp:auto-confirm false;
              set net:max-retries 2;
              set cmd:fail-exit yes;
              cd $TARGET_DIR/medienmonitor;
              put youtube-ausgabe/youtube.html -o youtube.html.neu;
              rm -f youtube.html;
              mv youtube.html.neu youtube.html;
              put youtube-ausgabe/kanaele.html -o kanaele.html.neu;
              rm -f kanaele.html;
              mv kanaele.html.neu kanaele.html;
              bye"
            echo "youtube.html und kanaele.html hochgeladen."
          fi
