<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Medienmonitor – Grafik</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 0.25rem 0.5rem; background: #fff; color: #1B1B1B;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  p { margin: 0.4rem 0; }
  .stand, .hinweis, .quelle, .klein { font-size: 0.85rem; color: #555; }
  .schalter { display: inline-flex; border: 1px solid #c7ccd4; border-radius: 0.3rem;
    overflow: hidden; margin: 0.4rem 0; }
  .schalter button { font: inherit; padding: 0.3rem 0.8rem; border: 0; background: #fff;
    color: #1B1B1B; cursor: pointer; }
  .schalter button + button { border-left: 1px solid #c7ccd4; }
  .schalter button[aria-pressed="true"] { background: #0077BB; color: #fff; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  h2 { font-size: 1.1rem; margin: 1rem 0 0.3rem; }
  .themen { columns: 2 18rem; padding-left: 1.1rem; margin: 0.3rem 0; }
  .themen button, .alle { font: inherit; background: none; border: 0; padding: 0;
    color: #0077BB; text-decoration: underline; cursor: pointer; text-align: left; }
  .artikel ul { padding-left: 1.1rem; }
  .artikel li { margin: 0.25rem 0; }
  .artikel a { color: #0077BB; }
  .grau { color: #767676; }
  .fehler { color: #B2182B; }
  .kategorien { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
    gap: 0.4rem 1.2rem; }
  .kategorien h3 { font-size: 1rem; margin: 0.6rem 0 0.1rem; }
  .kategorien details { margin: 0.25rem 0; }
  .kategorien summary { cursor: pointer; }
  .kategorien summary .grau { font-size: 0.85rem; }
  .kategorien ul { padding-left: 1.1rem; margin: 0.2rem 0 0.5rem; font-size: 0.9rem; }
  .kategorien a { color: #0077BB; }
  .ytick text { pointer-events: all; cursor: pointer; }
  .fenster { position: absolute; z-index: 10; width: min(30rem, calc(100vw - 1.5rem));
    max-height: 22rem; overflow-y: auto; background: #fff; border: 1px solid #c7ccd4;
    border-radius: 0.3rem; box-shadow: 0 0.3rem 1rem rgba(0, 0, 0, 0.15);
    padding: 0.5rem 0.8rem; font-size: 0.9rem; }
  .fenster h3 { font-size: 1rem; margin: 0 1.6rem 0.3rem 0; }
  .fenster ul { padding-left: 1.1rem; margin: 0.3rem 0; }
  .fenster li { margin: 0.2rem 0; }
  .fenster a { color: #0077BB; }
  .fenster .zu { position: absolute; top: 0.3rem; right: 0.4rem; font: inherit;
    font-size: 1.2rem; line-height: 1; background: none; border: 0; cursor: pointer;
    color: #555; }
</style>
</head>
<body>
<p class="stand" id="stand">{{STAND}}</p>
{{WINDOW_BUTTONS}}
<div class="schalter ansicht" role="group" aria-label="Ansicht">{{BUTTONS}}</div>
<p class="hinweis" id="hinweis"></p>
<div class="scroll"><div id="grafik"></div></div>
<p class="quelle">{{SOURCE}}.</p>
<section id="vergleich" hidden>
<h2>TOP-Themen und Blasen-Themen</h2>
<p class="klein" id="vergleich-hinweis"></p>
<div class="kategorien" id="kategorien"></div>
</section>
<h2>Schlagzeilen zum Thema</h2>
<p class="klein">Ein Feld der Grafik oder ein Thema anklicken, um die Schlagzeilen mit Links
zu sehen.</p>
<ul class="themen" id="themen"></ul>
<div class="artikel" id="artikel" aria-live="polite"></div>
<div class="fenster" id="fenster" role="dialog" aria-live="polite" hidden></div>
<script src="{{PLOTLY_SRC}}"></script>
<script>
// Data: Plotly figures made in Python (render.py) and the headlines per topic.
// ALL.fenster: one set per time window ("24h", "heute"); DATA = the chosen one.
const ALL = {{DATA}};
let DATA = {...ALL, ...ALL.fenster["24h"]};
(() => {
  "use strict";
  const chart = document.getElementById("grafik");
  const note = document.getElementById("hinweis");
  const list = document.getElementById("artikel");
  const popup = document.getElementById("fenster");
  const buttons = [...document.querySelectorAll(".schalter.ansicht button")];
  const windowButtons = [...document.querySelectorAll(".schalter.zeitraum button")];
  const stand = document.getElementById("stand");
  const time = new Intl.DateTimeFormat("de-DE", {
    weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin",
  });
  const state = {view: buttons[0]?.dataset.view, topic: null, group: null};

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    node.append(...children.filter(Boolean));
    return node;
  }
  const safeUrl = url => {
    try {
      const parsed = new URL(url);
      return ["https:", "http:"].includes(parsed.protocol) ? parsed.href : null;
    } catch {
      return null;
    }
  };

  const link = (url, text) => {
    const safe = safeUrl(url);
    return safe
      ? el("a", {href: safe, target: "_blank", rel: "noopener nofollow noreferrer", text})
      : el("span", {text});
  };

  // Window at the click: headlines of a cell, or the latest headlines of a medium.
  function closePopup() {
    if (!popup.hidden) {
      popup.hidden = true;
      popup.replaceChildren();
      reportHeight();
    }
  }
  function openPopup(x, y, heading, intro, rows) {
    const close = el("button", {type: "button", class: "zu", "aria-label": "schließen",
      text: "×"});
    close.addEventListener("click", closePopup);
    const items = el("ul");
    for (const [title, url, moment, note] of rows) {
      items.append(el("li", {},
        el("span", {class: "grau", text: `${time.format(new Date(moment))} · `}),
        link(url, title),
        note ? el("span", {class: "grau", text: ` (${note})`}) : null));
    }
    popup.replaceChildren(close, heading, intro, items);
    popup.hidden = false;
    Plotly.Fx.unhover(chart);
    const width = popup.offsetWidth;
    const left = Math.min(Math.max(x + 12, 8), document.documentElement.clientWidth - width - 8);
    popup.style.left = `${Math.max(left, 8)}px`;
    popup.style.top = `${y + 12}px`;
    reportHeight();
  }
  function mediumHeading(name) {
    const medium = DATA.medien[name] || {};
    const heading = el("h3", {text: name});
    if (medium.domain) {
      heading.append(" ", link(medium.domain, new URL(medium.domain).host.replace(/^www\./, "")
        + " ↗"));
    }
    return heading;
  }
  function showLatest(name, x, y) {
    const latest = (DATA.medien[name] || {}).neueste || [];
    openPopup(x, y, mediumHeading(name),
      el("p", {class: "klein", text: latest.length
        ? `Die letzten ${latest.length} Schlagzeilen (alle Themen):`
        : "Keine Schlagzeilen in den letzten 24 Stunden."}),
      latest.map(([title, url, moment, topic]) => [title, url, moment, topic]));
  }
  function showCell(topicId, name, x, y) {
    const topic = DATA.themen[topicId];
    const rows = topic.artikel.filter(a => a[0] === name).map(a => [a[3], a[4], a[5], null]);
    if (!rows.length) {
      showLatest(name, x, y);
      return;
    }
    openPopup(x, y, mediumHeading(name),
      el("p", {class: "klein", text: `${topic.name}: ${rows.length} Schlagzeile`
        + (rows.length === 1 ? "" : "n")}), rows);
  }

  // Tell the embedding page (same domain) how tall the content is. Measured from the
  // content, not scrollHeight: that is never below the frame's own height, so every
  // report would make the frame taller and the page would grow without end.
  let reported = 0;
  function reportHeight() {
    if (window.parent === window) return;
    const bottom = rect => rect.bottom + window.scrollY;
    let height = bottom(document.body.getBoundingClientRect());
    if (!popup.hidden) height = Math.max(height, bottom(popup.getBoundingClientRect()) + 8);
    height = Math.ceil(height);
    if (Math.abs(height - reported) < 2) return;
    reported = height;
    window.parent.postMessage({medienmonitorHoehe: height}, location.origin);
  }

  function draw() {
    for (const button of buttons) {
      button.setAttribute("aria-pressed", String(button.dataset.view === state.view));
    }
    const figure = DATA.figures[state.view];
    if (!figure) {
      note.textContent = "";
      Plotly.purge(chart);
      chart.replaceChildren(el("p", {class: "klein",
        text: "Für diesen Zeitraum gibt es noch zu wenige Schlagzeilen."}));
      reportHeight();
      return;
    }
    note.textContent = DATA.notes[state.view];
    const narrow = document.body.clientWidth < 640;
    const layout = {...figure.layout};
    if (state.view === "medium") {
      // many topic columns: keep cells readable and scroll sideways on small screens
      const columns = figure.data[0].x.length;
      layout.width = Math.max(document.body.clientWidth - 16, narrow ? 140 + 30 * columns : 0);
    } else {
      layout.width = document.body.clientWidth - 16;
    }
    const trace = {...figure.data[0]};
    if (narrow && state.view === "medium") {
      trace.texttemplate = "";
      layout.yaxis = {...layout.yaxis, ticktext: layout.meta.kurz};
    }
    Plotly.react(chart, [trace], layout, {displayModeBar: false, locale: "de"})
      .then(reportHeight);
    chart.removeAllListeners?.("plotly_click");
    chart.on("plotly_click", event => {
      const custom = event.points[0].customdata;
      if (state.view === "medium") {
        const mouse = event.event;
        showCell(custom[4], custom[5], mouse.pageX, mouse.pageY);
        return;
      }
      state.topic = custom[4];
      state.group = custom[5];
      showArticles(true);
    });
  }

  function showArticles(scroll) {
    const topic = DATA.themen[state.topic];
    if (!topic) {
      list.replaceChildren();
      reportHeight();
      return;
    }
    // group filter: medium name (view "je Medium") or lager/spektrum key
    const field = {medium: 0, spektrum: 1, lager: 2}[state.view];
    const labels = DATA.labels[state.view === "lager" ? "lager" : "spektrum"];
    const articles = topic.artikel.filter(a => !state.group || a[field] === state.group);
    const groupName = state.view === "medium" ? state.group : labels[state.group];
    const heading = el("h3", {text: topic.name + (state.group ? ` – ${groupName}` : "")});
    const items = el("ul");
    for (const [source, spectrum, camp, title, url, moment] of articles) {
      const safe = safeUrl(url);
      const label = state.view === "lager" ? labels[camp] : labels[spectrum];
      items.append(el("li", {},
        el("span", {class: "grau", text: `${time.format(new Date(moment))} · `}),
        el("strong", {text: source}),
        el("span", {class: "grau", text: ` (${label ?? ""}): `}),
        safe
          ? el("a", {href: safe, target: "_blank", rel: "noopener nofollow noreferrer",
            text: title})
          : el("span", {text: title})));
    }
    let all = null;
    if (state.group) {
      all = el("button", {type: "button", class: "alle",
        text: state.view === "medium" ? "alle Medien zeigen" : "alle Gruppen zeigen"});
      all.addEventListener("click", () => { state.group = null; showArticles(false); });
    }
    list.replaceChildren(heading, el("p", {class: "klein", text: topic.beschreibung}), all, items);
    reportHeight();
    if (scroll) heading.scrollIntoView({behavior: "smooth", block: "nearest"});
  }

  if (!window.Plotly) {
    chart.replaceChildren(el("p", {class: "fehler",
      text: "Die Grafik konnte nicht geladen werden. Bitte später erneut versuchen."}));
    return;
  }
  // Click on a medium's name (y axis label); its ↗ link opens the website instead.
  chart.addEventListener("click", event => {
    if (state.view !== "medium" || event.target.closest("a")) return;
    const tick = event.target.closest(".ytick");
    const row = tick?.querySelector("text")?.__data__?.x;
    const names = DATA.figures.medium.layout.meta.medien;
    if (row === undefined || !names[row]) return;
    event.stopPropagation();
    showLatest(names[row], event.pageX, event.pageY);
  });
  document.addEventListener("click", event => {
    if (!popup.hidden && !popup.contains(event.target) && !chart.contains(event.target)) {
      closePopup();
    }
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closePopup();
  });
  const nav = document.getElementById("themen");
  function buildNav() {
    nav.replaceChildren();
    for (const id of DATA.reihenfolge) {
      const topic = DATA.themen[id];
      const button = el("button", {type: "button",
        text: `${topic.name} (${topic.artikel.length})`});
      button.addEventListener("click", () => {
        state.topic = id;
        state.group = null;
        showArticles(true);
      });
      nav.append(el("li", {}, button));
    }
  }
  buildNav();
  // Time window: last 24 hours or today since midnight.
  for (const button of windowButtons) {
    button.addEventListener("click", () => {
      for (const other of windowButtons) {
        other.setAttribute("aria-pressed", String(other === button));
      }
      DATA = {...ALL, ...ALL.fenster[button.dataset.window]};
      stand.textContent = DATA.stand;
      if (!DATA.themen[state.topic]) state.topic = null;
      state.group = null;
      closePopup();
      buildNav();
      draw();
      showArticles(false);
    });
  }
  for (const button of buttons) {
    button.addEventListener("click", () => {
      state.view = button.dataset.view;
      state.group = null;
      closePopup();
      draw();
      showArticles(false);
    });
  }
  // Direct link to a topic: the embedding page passes #thema=T5 on.
  const wanted = new URLSearchParams(location.hash.slice(1)).get("thema");
  if (wanted && DATA.themen[wanted]) state.topic = wanted;
  draw();
  showArticles(false);
  // TOP-Themen (both sides) and Blasen-Themen (one side only), each with its headlines.
  function showCategories() {
    const data = DATA.kategorien;
    if (!data) return;
    const labels = {politik: "Politik", wirtschaft: "Wirtschaft", gesellschaft: "Gesellschaft"};
    const ressorts = data.ressorts.map(r => labels[r] ?? r).join(", ");
    document.getElementById("vergleich-hinweis").textContent =
      `TOP-Themen: in den letzten ${data.stunden.top} Stunden von mindestens `
      + `${data.min_medien.neu} neuen und ${data.min_medien.alt} alten Medien aufgegriffen. `
      + `Blasen-Themen: in den letzten ${data.stunden.blasen} Stunden nur von einer Seite `
      + `(mindestens ${data.min_medien.neu} neue bzw. ${data.min_medien.alt} alte Medien, `
      + `${data.min_artikel} Schlagzeilen), nur Ressorts ${ressorts}. Bevor ein Thema hier erscheint, prüft die KI, ob die `
      + "andere Seite dasselbe Ereignis unter anderem Namen behandelt; dann werden beide "
      + "Themen zusammengelegt. Thema anklicken: Schlagzeilen mit Links.";
    const columns = [
      ["top", "TOP-Themen", "von beiden Seiten aufgegriffen"],
      ["blase_neu", "Blasen-Themen: nur neue Medien", "kein altes Medium berichtet"],
      ["blase_alt", "Blasen-Themen: nur alte Medien", "kein neues Medium berichtet"],
    ];
    const grid = document.getElementById("kategorien");
    for (const [key, title, empty] of columns) {
      const column = el("div", {}, el("h3", {text: title}));
      const entries = data[key] || [];
      if (!entries.length) column.append(el("p", {class: "klein", text: `Zurzeit keine (${empty}).`}));
      for (const entry of entries) {
        const count = side => `${side.artikel} Schlagzeilen aus ${side.medien} Medien`;
        const numbers = key === "top"
          ? ` · neu ${entry.neu.artikel} (${entry.neu.medien} Medien) · alt `
            + `${entry.alt.artikel} (${entry.alt.medien} Medien)`
          : ` · ${count(key === "blase_neu" ? entry.neu : entry.alt)}`;
        const summary = el("summary", {}, el("span", {text: entry.name}),
          el("span", {class: "grau", text: numbers}));
        const items = el("ul");
        for (const article of entry.artikel) {
          items.append(el("li", {},
            el("span", {class: "grau", text: `${time.format(new Date(article.zeit))} · `}),
            el("strong", {text: article.quelle}),
            el("span", {class: "grau", text: ": "}),
            link(article.url, article.titel)));
        }
        const details = el("details", {}, summary,
          el("p", {class: "klein", text: entry.beschreibung}), items);
        details.addEventListener("toggle", reportHeight);
        column.append(details);
      }
      grid.append(column);
    }
    document.getElementById("vergleich").hidden = false;
    reportHeight();
  }
  showCategories();

  // Redraw only when the width changes; a new frame height needs no redraw.
  let timer;
  let width = document.body.clientWidth;
  window.addEventListener("resize", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (document.body.clientWidth === width) return;
      width = document.body.clientWidth;
      draw();
    }, 150);
  });
})();
</script>
</body>
</html>
