<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Medienmonitor – YouTube</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 0.25rem 0.5rem; background: #fff; color: #1B1B1B;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  p { margin: 0.4rem 0; }
  .stand, .hinweis, .quelle { font-size: 0.85rem; color: #555; }
  .schalter { display: inline-flex; border: 1px solid #c7ccd4; border-radius: 0.3rem;
    overflow: hidden; margin: 0.4rem 0; }
  .schalter button { font: inherit; padding: 0.3rem 0.8rem; border: 0; background: #fff;
    color: #1B1B1B; cursor: pointer; }
  .schalter button + button { border-left: 1px solid #c7ccd4; }
  .schalter button[aria-pressed="true"] { background: #0077BB; color: #fff; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { padding: 0.25rem 0.4rem; border-bottom: 1px solid #e3e6ea; text-align: left;
    vertical-align: top; }
  th { font-weight: 600; white-space: nowrap; }
  td.zahl, th.zahl { text-align: right; white-space: nowrap; }
  tr.markiert { background: #E6F1F8; }
  a { color: #0077BB; }
  .grau { color: #767676; font-size: 0.8rem; }
  .zeichen { display: inline-block; width: 0.7rem; height: 0.7rem; margin-right: 0.3rem; }
  .medienhaus { background: #0077BB; border-radius: 50%; }
  .unabhaengig { background: #EE7733; transform: rotate(45deg) scale(0.85); }
  .fehler { color: #B2182B; }
  .leer { color: #555; padding: 2rem 0; }
  .schalter-zeile { display: flex; flex-wrap: wrap; gap: 0 1rem; align-items: center; }
  th.sortiert { text-decoration: underline; text-underline-offset: 0.2em; }
  td.sortiert { font-weight: 600; }
</style>
</head>
<body>
<p class="stand" id="stand"></p>
<div class="schalter-zeile">
<div class="schalter" role="group" aria-label="Sprache">{{BUTTONS}}</div>
<div class="schalter" role="group" aria-label="Sortierung">{{METRIC_BUTTONS}}</div>
<div class="schalter" role="group" aria-label="Thema">{{THEME_BUTTONS}}</div>
</div>
<p class="hinweis" id="hinweis"></p>
<div id="grafik"></div>
<p class="leer" id="leer" hidden>Keine Videos in dieser Auswahl. Die Aufrufe am ersten Tag
werden erst seit Kurzem erfasst.</p>
<p class="quelle">{{SOURCE}}.</p>
<div class="scroll">
<table>
  <thead><tr><th class="zahl">Rang</th><th>Kanal</th><th class="zahl">Abonnenten</th>
    <th>Titel</th><th class="zahl">Dauer</th><th class="zahl" data-metric="aufrufe">Aufrufe</th>
    <th class="zahl">Tage online</th><th class="zahl" data-metric="aufrufe_je_tag">Aufrufe je Tag</th>
    <th class="zahl" data-metric="aufrufe_erster_tag">Aufrufe am ersten Tag</th></tr></thead>
  <tbody id="liste"></tbody>
</table>
</div>
<script src="{{PLOTLY_SRC}}"></script>
<script>
// Data: per language a Plotly figure made in Python (youtube_render.py) and the top list.
const DATA = {{DATA}};
(() => {
  "use strict";
  const chart = document.getElementById("grafik");
  const body = document.getElementById("liste");
  const stand = document.getElementById("stand");
  const hint = document.getElementById("hinweis");
  const buttons = [...document.querySelectorAll(".schalter button[data-view]")];
  const metricButtons = [...document.querySelectorAll(".schalter button[data-metric]")];
  const themeButtons = [...document.querySelectorAll(".schalter button[data-theme]")];
  const heads = [...document.querySelectorAll("th[data-metric]")];
  const state = {view: buttons[0]?.dataset.view, metric: DATA.metrics[0],
    theme: themeButtons[0]?.dataset.theme, marked: null};
  const current = () => DATA.views[state.view][state.theme][state.metric];

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    node.append(...children.filter(Boolean));
    return node;
  }
  const safeUrl = url => {
    try {
      const parsed = new URL(url);
      return parsed.protocol === "https:" && parsed.hostname === "www.youtube.com"
        ? parsed.href : null;
    } catch {
      return null;
    }
  };
  // Height of the content, not scrollHeight: that is never below the frame's own height,
  // so every report would make the frame taller and the page would grow without end.
  let reported = 0;
  function reportHeight() {
    if (window.parent === window) return;
    const height = Math.ceil(document.body.getBoundingClientRect().bottom + window.scrollY);
    if (Math.abs(height - reported) < 2) return;
    reported = height;
    window.parent.postMessage({medienmonitorYoutubeHoehe: height}, location.origin);
  }

  function table() {
    const both = state.view === "alle";
    body.replaceChildren();
    const sorted = metric => (state.metric === metric ? "zahl sortiert" : "zahl");
    for (const [rank, group, channel, title, url, duration, views, days, perDay, subscribers,
      language, firstDay] of current().rows) {
      const safe = safeUrl(url);
      const row = el("tr", {id: `rang-${rank}`},
        el("td", {class: "zahl", text: String(rank)}),
        el("td", {}, el("span", {class: `zeichen ${group}`, title: DATA.groups[group]}),
          el("span", {text: channel}),
          both && language ? el("span", {class: "grau", text: ` ${language}`}) : null),
        el("td", {class: "zahl", text: subscribers}),
        el("td", {}, safe
          ? el("a", {href: safe, target: "_blank", rel: "noopener nofollow noreferrer",
            text: title})
          : el("span", {text: title})),
        el("td", {class: "zahl", text: duration}),
        el("td", {class: sorted("aufrufe"), text: views}),
        el("td", {class: "zahl", text: days}),
        el("td", {class: sorted("aufrufe_je_tag"), text: perDay}),
        el("td", {class: sorted("aufrufe_erster_tag"), text: firstDay}));
      if (rank === state.marked) row.classList.add("markiert");
      body.append(row);
    }
  }

  function draw() {
    for (const button of buttons) {
      button.setAttribute("aria-pressed", String(button.dataset.view === state.view));
    }
    for (const button of metricButtons) {
      button.setAttribute("aria-pressed", String(button.dataset.metric === state.metric));
    }
    for (const button of themeButtons) {
      button.setAttribute("aria-pressed", String(button.dataset.theme === state.theme));
    }
    for (const head of heads) head.classList.toggle("sortiert", head.dataset.metric === state.metric);
    const view = current();
    stand.textContent = view.stand;
    hint.textContent = view.hinweis;
    const empty = !view.rows.length;
    document.getElementById("leer").hidden = !empty;
    if (window.Plotly) chart.hidden = empty;
    if (window.Plotly && !empty) {
      const layout = {...view.figure.layout, width: document.body.clientWidth - 16};
      const narrow = document.body.clientWidth < 640;
      const data = view.figure.data.map(trace => ({
        ...trace, mode: narrow ? "markers" : trace.mode,
        // long group names: one break after the first comma on phones
        name: narrow ? trace.name.replace(", ", ",<br>") : trace.name,
      }));
      Plotly.react(chart, data, layout, {displayModeBar: false, locale: "de"})
        .then(reportHeight);
    }
    table();
    reportHeight();
  }

  if (!window.Plotly) {
    chart.replaceChildren(el("p", {class: "fehler",
      text: "Die Grafik konnte nicht geladen werden. Bitte später erneut versuchen."}));
  }
  draw();
  if (window.Plotly) {
    chart.on("plotly_click", event => {
      state.marked = event.points[0].customdata[0];
      table();
      document.getElementById(`rang-${state.marked}`)
        ?.scrollIntoView({behavior: "smooth", block: "nearest"});
    });
  }
  for (const button of buttons) {
    button.addEventListener("click", () => {
      state.view = button.dataset.view;
      state.marked = null;
      draw();
    });
  }
  for (const button of themeButtons) {
    button.addEventListener("click", () => {
      state.theme = button.dataset.theme;
      state.marked = null;
      draw();
    });
  }
  for (const button of metricButtons) {
    button.addEventListener("click", () => {
      state.metric = button.dataset.metric;
      state.marked = null;
      draw();
    });
  }
  // Redraw only when the width changes; a new frame height needs no redraw.
  let timer;
  let width = document.body.clientWidth;
  window.addEventListener("resize", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (document.body.clientWidth === width) return;
      width = document.body.clientWidth;
      draw();
    }, 150);
  });
})();
</script>
</body>
</html>
