<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Medienmonitor – YouTube-Kanäle</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 0.25rem 0.5rem; background: #fff; color: #1B1B1B;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  p { margin: 0.4rem 0; }
  .stand, .quelle { font-size: 0.85rem; color: #555; }
  h2 { font-size: 1.1rem; margin: 1.2rem 0 0.3rem; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { padding: 0.25rem 0.4rem; border-bottom: 1px solid #e3e6ea; text-align: left;
    vertical-align: top; }
  th { font-weight: 600; white-space: nowrap; }
  td.zahl, th.zahl { text-align: right; white-space: nowrap; }
  a { color: #0077BB; }
  .grau { color: #767676; font-size: 0.8rem; }
  .schalter { display: inline-flex; border: 1px solid #c7ccd4; border-radius: 0.3rem;
    overflow: hidden; margin: 0.4rem 0; }
  .schalter button { font: inherit; padding: 0.3rem 0.8rem; border: 0; background: #fff;
    color: #1B1B1B; cursor: pointer; }
  .schalter button + button { border-left: 1px solid #c7ccd4; }
  .schalter button[aria-pressed="true"] { background: #0077BB; color: #fff; }
  .zeichen { display: inline-block; width: 0.7rem; height: 0.7rem; margin-right: 0.4rem; }
  .medienhaus { background: #0077BB; border-radius: 50%; }
  .unabhaengig { background: #EE7733; transform: rotate(45deg) scale(0.85); }
</style>
</head>
<body>
<p class="stand">{{STAND}}</p>
<div class="schalter" role="group" aria-label="Sprache">{{BUTTONS}}</div>
{{SECTIONS}}
<p class="quelle">{{SOURCE}}.</p>
<script>
  // Language choice: show one of the prepared views.
  const buttons = [...document.querySelectorAll(".schalter button")];
  const views = [...document.querySelectorAll(".ansicht")];
  // Tell the embedding page (same domain) how tall the content is.
  const report = () => {
    if (window.parent !== window) {
      window.parent.postMessage(
        {medienmonitorKanaeleHoehe: document.documentElement.scrollHeight}, location.origin);
    }
  };
  for (const button of buttons) {
    button.addEventListener("click", () => {
      for (const other of buttons) {
        other.setAttribute("aria-pressed", String(other === button));
      }
      for (const view of views) view.hidden = view.dataset.view !== button.dataset.view;
      report();
    });
  }
  window.addEventListener("load", report);
  window.addEventListener("resize", report);
</script>
</body>
</html>
