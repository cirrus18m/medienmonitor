<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Medienmonitor – YouTube-Kanäle</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 0.25rem 0.5rem; background: #fff; color: #1B1B1B;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  p { margin: 0.4rem 0; }
  .stand, .quelle { font-size: 0.85rem; color: #555; }
  h2 { font-size: 1.1rem; margin: 1.2rem 0 0.3rem; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { padding: 0.25rem 0.4rem; border-bottom: 1px solid #e3e6ea; text-align: left;
    vertical-align: top; }
  th { font-weight: 600; white-space: nowrap; }
  td.zahl, th.zahl { text-align: right; white-space: nowrap; }
  a { color: #0077BB; }
  .grau { color: #767676; font-size: 0.8rem; }
  .schalter { display: inline-flex; border: 1px solid #c7ccd4; border-radius: 0.3rem;
    overflow: hidden; margin: 0.4rem 0; }
  .schalter button { font: inherit; padding: 0.3rem 0.8rem; border: 0; background: #fff;
    color: #1B1B1B; cursor: pointer; }
  .schalter button + button { border-left: 1px solid #c7ccd4; }
  .schalter button[aria-pressed="true"] { background: #0077BB; color: #fff; }
  .zeichen { display: inline-block; width: 0.7rem; height: 0.7rem; margin-right: 0.4rem; }
  .medienhaus { background: #0077BB; border-radius: 50%; }
  .unabhaengig { background: #EE7733; transform: rotate(45deg) scale(0.85); }
</style>
</head>
<body>
<p class="stand">{{STAND}}</p>
<div class="schalter" role="group" aria-label="Sprache">{{BUTTONS}}</div>
<div class="schalter sortierung" role="group" aria-label="Sortierung">{{SORT_BUTTONS}}</div>
<div class="schalter themen" role="group" aria-label="Themen">{{THEME_BUTTONS}}</div>
<p class="stand" id="themen-hinweis">Themen: mehrere wählbar; gezeigt werden Kanäle mit
mindestens einem der gewählten Themen. Ohne Auswahl alle Kanäle.</p>
{{SECTIONS}}
<p class="quelle">{{SOURCE}}.</p>
<script>
  // Language choice: show one of the prepared views.
  const buttons = [...document.querySelectorAll(".schalter:not(.sortierung):not(.themen) button")];
  const themeButtons = [...document.querySelectorAll(".themen button")];
  const sortButtons = [...document.querySelectorAll(".sortierung button")];
  const views = [...document.querySelectorAll(".ansicht")];
  // Tell the embedding page (same domain) how tall the content is. Measured from the
  // content, not scrollHeight: that is never below the frame's own height, so every
  // report would make the frame taller and the page would grow without end.
  let reported = 0;
  const report = () => {
    if (window.parent === window) return;
    const height = Math.ceil(document.body.getBoundingClientRect().bottom + window.scrollY);
    if (Math.abs(height - reported) < 2) return;
    reported = height;
    window.parent.postMessage({medienmonitorKanaeleHoehe: height}, location.origin);
  };
  const press = (group, chosen) => {
    for (const other of group) other.setAttribute("aria-pressed", String(other === chosen));
  };
  for (const button of buttons) {
    button.addEventListener("click", () => {
      press(buttons, button);
      for (const view of views) view.hidden = view.dataset.view !== button.dataset.view;
      report();
    });
  }
  // Sorting: growth relative (default, as delivered), growth absolute, alphabetical;
  // channels without a change stay at the end.
  const compare = key => (a, b) => {
    if (key === "name") return a.dataset.name.localeCompare(b.dataset.name, "de");
    const x = a.dataset[key], y = b.dataset[key];
    if (x === "" || y === "") return (x === "") - (y === "") || a.dataset.name.localeCompare(b.dataset.name, "de");
    return Number(y) - Number(x) || a.dataset.name.localeCompare(b.dataset.name, "de");
  };
  for (const button of sortButtons) {
    button.addEventListener("click", () => {
      press(sortButtons, button);
      for (const body of document.querySelectorAll("tbody")) {
        body.append(...[...body.rows].sort(compare(button.dataset.sort)));
      }
    });
  }
  // Topic filter: several labels at once; a channel shows if it has one of them.
  const filterThemes = () => {
    const chosen = themeButtons.filter(b => b.getAttribute("aria-pressed") === "true")
      .map(b => b.dataset.thema);
    for (const view of views) {
      let total = 0;
      for (const table of view.querySelectorAll("table")) {
        let shown = 0;
        for (const row of table.tBodies[0].rows) {
          const own = row.dataset.themen ? row.dataset.themen.split("|") : [];
          const visible = !chosen.length || chosen.some(theme => own.includes(theme));
          row.hidden = !visible;
          shown += visible;
        }
        const count = table.closest(".scroll").previousElementSibling?.querySelector(".anzahl");
        if (count) count.textContent = String(shown);
        total += shown;
      }
      const all = view.querySelector(".anzahl-gesamt");
      if (all) all.textContent = String(total);
    }
    report();
  };
  for (const button of themeButtons) {
    button.addEventListener("click", () => {
      const on = button.getAttribute("aria-pressed") !== "true";
      button.setAttribute("aria-pressed", String(on));
      filterThemes();
    });
  }
  window.addEventListener("load", report);
  let width = document.body.clientWidth;
  window.addEventListener("resize", () => {
    if (document.body.clientWidth !== width) {
      width = document.body.clientWidth;
      report();
    }
  });
</script>
</body>
</html>
