# YouTube-Kanäle für die YouTube-Trends (PLAN.md, Abschnitt 2)
#
# Felder:
#   name      Anzeigename
#   kanal_id  YouTube-Kanal-ID (UC…); Feed: https://www.youtube.com/feeds/videos.xml?channel_id=<kanal_id>
#   handle    @-Name des Kanals (nur zur Orientierung)
#   sprache   de | en | mehrsprachig (Auswahl der Grafik; je Video zählt die Tonspur-Sprache, falls angegeben)
#   land      Land laut Kanal bzw. Sitz
#   art       oeffentlich (öffentlich-rechtlich/staatlich, auch funk) | privat (privates
#             Medienhaus) | unabhaengig | organisation
#             Gruppen der Grafik: oeffentlich/privat = „Staatliche und private Medienhäuser“
#             (außer lager alternativ), alle übrigen = „Unabhängige Kanäle, Organisationen
#             und neue Medien“
#   lager     wie in feeds.yaml: links | mitte | rechts | alternativ
#   spektrum  links | mitte-links | mitte | mitte-rechts | rechts | unklar
#   themen    Liste aus Technik, Politik, Gesellschaft, Finanzen, Natur (mehrere möglich);
#             Filter der YouTube-Seiten. Am 28.11.2026 nach Kanalbeschreibung und den
#             letzten Videotiteln eingeordnet (Vorschlag, bitte bei Bedarf anpassen)
#   aktiv     false = wird nicht abgerufen (Grund als Kommentar)
#
#   ausschliessen  reguläre Ausdrücke auf den Titel (Groß-/Kleinschreibung egal) für
#             regelmäßige Nachrichtensendungen dieses Kanals; allgemeine Muster in youtube.py
#
# Kanal-IDs am 24.11.2026 über die YouTube-Suche ermittelt (Name und Abonnentenzahl
# geprüft). Einordnung: VORSCHLAG nach derselben Regel wie feeds.yaml (etablierte
# Medienhäuser nach Spektrum, Kanäle mit Haltung gegen etablierte Medien "alternativ").

