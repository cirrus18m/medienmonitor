# Quellenliste für den Medienscanner
#
# Felder:
#   name      Anzeigename
#   domain    Startseite (für automatische Feed-Suche, falls der Feed nicht geht)
#   land      DE / AT / CH / RU
#   feed      RSS/Atom-Adresse
#   pruefen   true = Adresse noch nicht getestet (scripts/check_feeds.py)
#   aktiv     false = wird nicht abgerufen (Grund als Kommentar)
#   lager     grobe Gruppe für den Podcast: links | mitte | rechts | alternativ
#   spektrum  feinere Einordnung: links | mitte-links | mitte | mitte-rechts | rechts | unklar
#
# WICHTIG: "lager" und "spektrum" sind ein VORSCHLAG zum Start und bewusst
# anpassbar. Regel dafür:
#   - Etablierte Medien (Verlage, öffentlich-rechtliche Sender) -> lager nach spektrum
#     (mitte-links -> links, mitte-rechts -> rechts)
#   - Medien, die sich ausdrücklich gegen die etablierten Medien positionieren
#     -> lager "alternativ", die politische Richtung steht dann in "spektrum".
#     So kann der Podcast später auch "alternativ links" und "alternativ rechts" trennen.

quellen:

  # ---------- etabliert: links / mitte-links ----------
  - name: Spiegel
    domain: https://www.spiegel.de
    land: DE
    feed: https://www.spiegel.de/schlagzeilen/index.rss
    lager: links
    spektrum: mitte-links

  - name: Zeit
    domain: https://www.zeit.de
    land: DE
    feed: https://newsfeed.zeit.de/index
    lager: links
    spektrum: mitte-links

